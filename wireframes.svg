<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" font-family="system-ui, sans-serif" font-size="13" fill="#333" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .f { fill: #fff; stroke: #333; stroke-width: 2; }
    .b { fill: #fff; stroke: #666; stroke-width: 1.5; }
    .p { fill: #555; }
    .l { fill: #d6d6d6; }
    .t { font-weight: 700; font-size: 15px; }
    .w { fill: #fff; }
    .s { fill: #888; font-size: 11px; }
    .bt { font-size: 11px; }
    .ov { fill: #000; opacity: .25; }
  </style>
  <rect width="1240" height="600" fill="#f2f2f0"/>

  <!-- 1. Lista de tareas -->
  <text x="20" y="30" class="t">1. Lista de tareas (vista inicial)</text>
  <rect x="20" y="45" width="390" height="530" rx="8" class="f"/>
  <text x="40" y="80" class="t">Gestión de tareas</text>
  <text x="40" y="98" class="s">3 de 6 tareas completadas</text>
  <rect x="40" y="112" width="86" height="30" rx="5" class="p"/><text x="49" y="131" class="w bt">+ Nueva tarea</text>
  <rect x="132" y="112" width="60" height="30" rx="5" class="b"/><text x="141" y="131" class="bt">Importar</text>
  <rect x="198" y="112" width="118" height="30" rx="5" class="b"/><text x="208" y="131" class="bt">Marcar terminadas</text>
  <rect x="322" y="112" width="68" height="30" rx="5" class="b"/><text x="330" y="131" class="bt" fill="#b00">Vaciar lista</text>
  <rect x="40" y="152" width="240" height="30" rx="5" class="b"/><text x="50" y="172" class="s">Buscar tareas…</text>
  <rect x="288" y="152" width="102" height="30" rx="5" class="b"/><text x="298" y="172">Todas ▾</text>
  <g id="row">
    <rect x="40" y="196" width="350" height="52" rx="6" class="b"/>
    <rect x="52" y="214" width="14" height="14" rx="2" class="b"/>
    <rect x="78" y="208" width="190" height="9" rx="4" class="l"/>
    <text x="78" y="238" class="s">6 nov 2026 · Pendiente · Creada por ti · TSK-L-…</text>
    <text x="340" y="228">✎</text><text x="366" y="228">✕</text>
  </g>
  <use href="#row" y="60"/>
  <rect x="40" y="316" width="350" height="52" rx="6" class="b"/>
  <rect x="52" y="334" width="14" height="14" rx="2" fill="#ccc"/>
  <rect x="78" y="328" width="160" height="9" rx="4" class="l"/>
  <text x="78" y="358" class="s">6 nov 2026 · Pendiente · Importada (solo lectura)</text>
  <text x="340" y="348" fill="#bbb">✎</text><text x="366" y="348">✕</text>
  <text x="40" y="400" class="s">· Casilla = completada / pendiente</text>
  <text x="40" y="418" class="s">· ✎ editar (bloqueado en importadas) · ✕ eliminar</text>
  <text x="40" y="436" class="s">· Lista vacía: mensaje que invita a crear o importar</text>

  <!-- 2. Formulario modal -->
  <text x="430" y="30" class="t">2. Formulario (modal crear / editar)</text>
  <rect x="430" y="45" width="390" height="530" rx="8" class="f"/>
  <rect x="432" y="47" width="386" height="526" rx="7" class="ov"/>
  <rect x="460" y="120" width="330" height="360" rx="8" class="f"/>
  <text x="480" y="152" class="t">Nueva tarea / Editar tarea</text>
  <text x="480" y="180">Título *</text>
  <rect x="480" y="188" width="290" height="30" rx="5" class="b"/>
  <text x="480" y="242">Descripción (opcional)</text>
  <rect x="480" y="250" width="290" height="56" rx="5" class="b"/><text x="490" y="270" class="s">Breve descripción; no se muestra en la lista</text>
  <text x="480" y="330">Fecha de registro *</text>
  <rect x="480" y="338" width="290" height="30" rx="5" class="b"/><text x="490" y="358" class="s">dd/mm/aaaa (no futura)</text>
  <rect x="480" y="386" width="14" height="14" rx="2" class="b"/><text x="502" y="398">Completada</text>
  <rect x="604" y="430" width="80" height="30" rx="5" class="b"/><text x="618" y="450">Cancelar</text>
  <rect x="690" y="430" width="80" height="30" rx="5" class="p"/><text x="708" y="450" class="w">Guardar</text>

  <!-- 3. Importar modal -->
  <text x="840" y="30" class="t">3. Importar tareas (modal)</text>
  <rect x="840" y="45" width="380" height="530" rx="8" class="f"/>
  <rect x="842" y="47" width="376" height="526" rx="7" class="ov"/>
  <rect x="862" y="80" width="336" height="470" rx="8" class="f"/>
  <text x="882" y="112" class="t">Importar tareas</text>
  <text x="882" y="134" class="s">200 tareas disponibles · Cargando… / Error + Reintentar</text>
  <rect x="882" y="150" width="14" height="14" rx="2" class="b"/><text x="904" y="162">Seleccionar todas</text>
  <g id="item">
    <line x1="882" y1="178" x2="1178" y2="178" stroke="#ccc"/>
    <rect x="882" y="190" width="14" height="14" rx="2" class="p"/>
    <rect x="904" y="190" width="200" height="9" rx="4" class="l"/>
    <text x="904" y="218" class="s">#1 · Pendiente</text>
  </g>
  <use href="#item" y="46"/>
  <line x1="882" y1="270" x2="1178" y2="270" stroke="#ccc"/>
  <rect x="882" y="282" width="14" height="14" rx="2" fill="#ccc"/>
  <rect x="904" y="282" width="170" height="9" rx="4" class="l"/>
  <text x="904" y="310" class="s">#3 · Completada · Ya importada (deshabilitada)</text>
  <use href="#item" y="138"/>
  <text x="882" y="400" class="s">· Selección de una o varias tareas</text>
  <text x="882" y="418" class="s">· Se guardan con ID propio TSK-A-…</text>
  <rect x="1012" y="500" width="80" height="30" rx="5" class="b"/><text x="1026" y="520">Cancelar</text>
  <rect x="1098" y="500" width="80" height="30" rx="5" class="p"/><text x="1104" y="520" class="w">Importar (2)</text>
</svg>
